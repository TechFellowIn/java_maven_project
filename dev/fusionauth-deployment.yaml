apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: fusionauth
  name: fusionauth
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: fusionauth
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: fusionauth
    spec:
      containers:
        - env:
            - name: DATABASE_PASSWORD
            - name: DATABASE_ROOT_PASSWORD
            - name: DATABASE_ROOT_USERNAME
            - name: DATABASE_URL
              value: jdbc:postgresql://fusion_db:5432/fusionauth
            - name: DATABASE_USERNAME
            - name: FUSIONAUTH_APP_KICKSTART_FILE
            - name: FUSIONAUTH_APP_MEMORY
            - name: FUSIONAUTH_APP_RUNTIME_MODE
            - name: FUSIONAUTH_APP_URL
              value: http://fusionauth:9011
            - name: SEARCH_SERVERS
              value: http://search:9200
            - name: SEARCH_TYPE
              value: elasticsearch
          image: fusionauth/fusionauth-app:1.55.1
          name: fusionauth
          ports:
            - containerPort: 9011
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/local/fusionauth/config
              name: fusionauth-config
            - mountPath: /usr/local/fusionauth/kickstart
              name: fusionauth-claim1
      restartPolicy: Always
      volumes:
        - name: fusionauth-config
          persistentVolumeClaim:
            claimName: fusionauth-config
        - name: fusionauth-claim1
          persistentVolumeClaim:
            claimName: fusionauth-claim1
