apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: db
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: db
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: db
    spec:
      containers:
        - env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
            - name: POSTGRES_USER
          image: postgres:16.0-bookworm
          livenessProbe:
            exec:
              command:
                - pg_isready -U cognifyAdmin -d postgres
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          name: -db
          ports:
            - containerPort: 5432
              protocol: TCP
            - containerPort: 0
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-db-data
            - mountPath: /var/lib/postgresql/data/pg_hba.conf
              name: db-claim1
            - mountPath: /docker-entrypoint-initdb.d/init.sql
              name: db-claim2
      hostname: db
      restartPolicy: Always
      volumes:
        - name: postgres-db-data
          persistentVolumeClaim:
            claimName: postgres-db-data
        - name: db-claim1
          persistentVolumeClaim:
            claimName: db-claim1
        - name: db-claim2
          persistentVolumeClaim:
            claimName: db-claim2
