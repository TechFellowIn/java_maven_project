apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: fusion-db
  name: fusion-db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: fusion-db
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: fusion-db
    spec:
      containers:
        - env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: fusionauth
            - name: POSTGRES_PASSWORD
            - name: POSTGRES_USER
          image: postgres:16.0-bookworm
          livenessProbe:
            exec:
              command:
                - pg_isready -U  -d fusionauth
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 5
          name: -authdb
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: auth-db-data
            - mountPath: /var/lib/postgresql/data/pg_hba.conf
              name: fusion-db-claim1
            - mountPath: /docker-entrypoint-initdb.d/init.sql
              name: fusion-db-claim2
      restartPolicy: Always
      volumes:
        - name: auth-db-data
          persistentVolumeClaim:
            claimName: auth-db-data
        - name: fusion-db-claim1
          persistentVolumeClaim:
            claimName: fusion-db-claim1
        - name: fusion-db-claim2
          persistentVolumeClaim:
            claimName: fusion-db-claim2
