apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: search
  name: search
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: search
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: search
    spec:
      containers:
        - env:
            - name: bootstrap.memory_lock
              value: "true"
            - name: cluster.name
              value: fusionauth
            - name: discovery.type
              value: single-node
            - name: node.name
              value: search
            - name: plugins.security.disabled
              value: "true"
          image: opensearchproject/opensearch:2.11.0
          livenessProbe:
            exec:
              command:
                - curl --write-out 'HTTP %{http_code}' --fail --silent --output /dev/null http://localhost:9200/
            failureThreshold: 80
            periodSeconds: 10
          name: search
          ports:
            - containerPort: 9200
              protocol: TCP
            - containerPort: 9600
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/share/opensearch/data
              name: search-data
      restartPolicy: Always
      volumes:
        - name: search-data
          persistentVolumeClaim:
            claimName: search-data
