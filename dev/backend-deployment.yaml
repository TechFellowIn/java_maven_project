apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: backend
    spec:
      containers:
        - args:
            - /bin/sh
            - /app/deployment/scripts/backend/start.sh
          env:
            - name: ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  key: ALLOWED_HOSTS
                  name: env
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  key: APP_ENV
                  name: env
            - name: APP_HOST
              valueFrom:
                configMapKeyRef:
                  key: APP_HOST
                  name: env
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  key: APP_NAME
                  name: env
            - name: APP_PORT
              valueFrom:
                configMapKeyRef:
                  key: APP_PORT
                  name: env
            - name: APP_SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  key: APP_SECRET_KEY
                  name: env
            - name: CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  key: CLIENT_ID
                  name: env
            - name: CLIENT_SECRET
              valueFrom:
                configMapKeyRef:
                  key: CLIENT_SECRET
                  name: env
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  key: CORS_ALLOWED_ORIGINS
                  name: env
            - name: CSRF_TRUSTED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  key: CSRF_TRUSTED_ORIGINS
                  name: env
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  key: DEBUG
                  name: env
            - name: DEPLOY
              valueFrom:
                configMapKeyRef:
                  key: DEPLOY
                  name: env
            - name: EXTERNAL_IP
              valueFrom:
                configMapKeyRef:
                  key: EXTERNAL_IP
                  name: env
            - name: FUSIONAUTH_ADMIN_KEY
              valueFrom:
                configMapKeyRef:
                  key: FUSIONAUTH_ADMIN_KEY
                  name: env
            - name: FUSIONAUTH_API_KEY
              valueFrom:
                configMapKeyRef:
                  key: FUSIONAUTH_API_KEY
                  name: env
            - name: FUSIONAUTH_APP_ID
              valueFrom:
                configMapKeyRef:
                  key: FUSIONAUTH_APP_ID
                  name: env
            - name: FUSIONAUTH_APP_KICKSTART_FILE
              valueFrom:
                configMapKeyRef:
                  key: FUSIONAUTH_APP_KICKSTART_FILE
                  name: env
            - name: FUSIONAUTH_APP_MEMORY
              valueFrom:
                configMapKeyRef:
                  key: FUSIONAUTH_APP_MEMORY
                  name: env
            - name: FUSIONAUTH_APP_RUNTIME_MODE
              valueFrom:
                configMapKeyRef:
                  key: FUSIONAUTH_APP_RUNTIME_MODE
                  name: env
            - name: FUSIONAUTH_DATABASE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: FUSIONAUTH_DATABASE_PASSWORD
                  name: env
            - name: FUSIONAUTH_DATABASE_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: FUSIONAUTH_DATABASE_ROOT_PASSWORD
                  name: env
            - name: FUSIONAUTH_DATABASE_ROOT_USERNAME
              valueFrom:
                configMapKeyRef:
                  key: FUSIONAUTH_DATABASE_ROOT_USERNAME
                  name: env
            - name: FUSIONAUTH_DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  key: FUSIONAUTH_DATABASE_USERNAME
                  name: env
            - name: FUSIONAUTH_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  key: FUSIONAUTH_INTERNAL_URL
                  name: env
            - name: FUSIONAUTH_TENANT_KEY
              valueFrom:
                configMapKeyRef:
                  key: FUSIONAUTH_TENANT_KEY
                  name: env
            - name: FUSIONAUTH_USER_KEY
              valueFrom:
                configMapKeyRef:
                  key: FUSIONAUTH_USER_KEY
                  name: env
            - name: ISSUER
              valueFrom:
                configMapKeyRef:
                  key: ISSUER
                  name: env
            - name: MINIO_ACCESS_KEY
              valueFrom:
                configMapKeyRef:
                  key: MINIO_ACCESS_KEY
                  name: env
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  key: MINIO_ENDPOINT
                  name: env
            - name: MINIO_SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  key: MINIO_SECRET_KEY
                  name: env
            - name: OPENSEARCH_JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  key: OPENSEARCH_JAVA_OPTS
                  name: env
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  key: POSTGRES_DB
                  name: env
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  key: POSTGRES_HOST
                  name: env
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: POSTGRES_PASSWORD
                  name: env
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  key: POSTGRES_PORT
                  name: env
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  key: POSTGRES_USER
                  name: env
            - name: SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  key: SECRET_KEY
                  name: env
            - name: SECURE_PROXY_SSL_HEADER
              valueFrom:
                configMapKeyRef:
                  key: SECURE_PROXY_SSL_HEADER
                  name: env
            - name: TENANT_ID
              valueFrom:
                configMapKeyRef:
                  key: TENANT_ID
                  name: env
          image: 481665129159.dkr.ecr.eu-north-1.amazonaws.com/cognify-backend-dev:latest
          name: -backend
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/src/app
              name: backend-claim0
            - mountPath: /app/deployment/scripts
              name: backend-claim1
      restartPolicy: Always
      volumes:
        - name: backend-claim0
          persistentVolumeClaim:
            claimName: backend-claim0
        - name: backend-claim1
          persistentVolumeClaim:
            claimName: backend-claim1
